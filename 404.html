<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨韵书法篆刻艺术平台 - 部署成功</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        .logo {
            font-size: 64px;
            margin-bottom: 20px;
            color: #d97706;
        }
        
        h1 {
            font-size: 32px;
            color: #1e293b;
            margin-bottom: 16px;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 18px;
            color: #64748b;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        
        .feature {
            background: #f8fafc;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
        }
        
        .feature-icon {
            font-size: 32px;
            margin-bottom: 12px;
            color: #92400e;
        }
        
        .feature-title {
            font-size: 16px;
            color: #1e293b;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .feature-desc {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
        }
        
        .cta-button {
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(217, 119, 6, 0.3);
        }
        
        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .link {
            color: #92400e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .link:hover {
            background: #f8fafc;
            border-color: #d97706;
        }
        
        .footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🖌️</div>
        <h1>墨韵书法篆刻艺术平台</h1>
        <p class="subtitle">🎉 恭喜！您的书法篆刻艺术平台已成功部署到GitHub Pages！</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">📜</div>
                <div class="feature-title">书法艺术</div>
                <div class="feature-desc">五大字体展示：楷书、行书、草书、隶书、篆书</div>
            </div>
            
            <div class="feature">
                <div class="feature-icon">🔴</div>
                <div class="feature-title">篆刻艺术</div>
                <div class="feature-desc">专业篆刻展示：汉印、秦印、古玺、明清流派</div>
            </div>
            
            <div class="feature">
                <div class="feature-icon">🎨</div>
                <div class="feature-title">水墨风UI</div>
                <div class="feature-desc">传统书法配色与现代设计的完美融合</div>
            </div>
            
            <div class="feature">
                <div class="feature-icon">👥</div>
                <div class="feature-title">社区互动</div>
                <div class="feature-desc">用户注册、作品上传、点赞评论功能</div>
            </div>
        </div>
        
        <a href="/" class="cta-button">🚀 立即体验平台</a>
        
        <div class="links">
            <a href="/works" class="link">📜 书法作品</a>
            <a href="/seal-engraving" class="link">🔴 篆刻艺术</a>
            <a href="/search" class="link">🔍 搜索作品</a>
            <a href="/login" class="link">👤 用户登录</a>
        </div>
        
        <div class="footer">
            <p>✨ 让传统艺术在现代焕发新生</p>
            <p>🖌️ 墨韵书法篆刻艺术平台 - 传承中华文化之美</p>
        </div>
    </div>
</body>
</html>
